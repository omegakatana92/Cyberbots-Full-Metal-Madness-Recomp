# Cyberbots: Fullmetal Madness (Capcom 1995, CPS-2 arcade board): per-game settings read by the
# cps2recomp toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = Cyberbots
# What the window is called (the name stays the folder the player's settings are kept under)
title = Cyberbots Recomp
id = cybots
# Reverse-DNS app identifier (macOS bundle id / launcher). Change the "cyberbotsrecomp" part to your own.
app_id = io.github.cyberbotsrecomp
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# Cyberbots has no parent set, so rom_parent is the set itself.
rom_set = cybots
rom_parent = cybots
rom_name = Cyberbots: Fullmetal Madness (Europe 950424)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words).
# sound_program: the Z80's ROMs. samples: the QSound chip's. key: the board's cipher key.
program = cybe.03:234381cd cybe.04:80691061 cyb.05:ec40408e cyb.06:1ad0bed2 cyb.07:6245a39a cyb.08:4b48e223 cyb.09:e15238f6 cyb.10:75f4003b
graphics = cyb.13m:f0dce192 cyb.15m:187aa39c cyb.17m:8a0e4b12 cyb.19m:34b62612 cyb.14m:c1537957 cyb.16m:15349e86 cyb.18m:d83e977d cyb.20m:77cdad5c
sound_program = cyb.01:9c0fb079 cyb.02:51cb0c4e
samples = cyb.11m:362ccab2 cyb.12m:7066e9cc
key = cybots.key:9bbcbef3

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The maincpu
# region is 4 MiB; this spans the whole program. Lower it once the code is known to end sooner.
code_end = 400000
